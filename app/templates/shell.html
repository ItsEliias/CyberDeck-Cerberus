<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CyberDeck</title>
  <meta name="theme-color" content="#1a1d23">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2L4 7V18C4 24 10 29 16 31C22 29 28 24 28 18V7Z' fill='none' stroke='%23c0392b' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- Cerberus theme bootstrap: apply the saved palette before first paint so
       there's no flash. Reads the same `cerberus-theme` localStorage key the
       theme engine writes. Compact form of Cerberus's index.html bootstrap. -->
  <script>
  (function(){
    try {
      var t = JSON.parse(localStorage.getItem('cerberus-theme'));
      if (t && t.colors) {
        var s = document.documentElement.style, c = t.colors;
        s.setProperty('--bg', c.bg); s.setProperty('--fg', c.fg);
        s.setProperty('--panel', c.panel); s.setProperty('--border', c.border);
        if (c.red) { s.setProperty('--red', c.red); s.setProperty('--brand-color', c.red); }
        var mtc = document.querySelector('meta[name="theme-color"]');
        if (mtc && c.bg) mtc.setAttribute('content', c.bg);
      }
    } catch(e){}
  })();
  </script>

  <!-- Cerberus design system: base, then the jarvis-v2 HUD layers on top,
       matching the original load order. -->
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/jarvis-v2/tokens.css">
  <link rel="stylesheet" href="/static/jarvis-v2/components.css">
  <link rel="stylesheet" href="/static/jarvis-v2/surfaces.css">
  <link rel="stylesheet" href="/static/jarvis-v2/surfaces-phase-b.css">
  <link rel="stylesheet" href="/static/jarvis-v2/surfaces-phase-b2.css">
  <link rel="stylesheet" href="/static/jarvis-v2/hud.css">
  <link rel="stylesheet" href="/static/jarvis-v2/popup-shell-hud.css">
  <link rel="stylesheet" href="/static/jarvis-v2/shell-panels-hud.css">
  <link rel="stylesheet" href="/static/jarvis-v2/tool-tabs-hud.css">
  <link rel="stylesheet" href="/static/dashboard.css">
  <link rel="stylesheet" href="/static/deck/deck.css">
</head>
<body>
  <!-- Left icon rail (populated by deck.js) -->
  <div class="icon-rail" id="icon-rail"></div>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar" role="navigation" aria-label="Sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand" id="sidebar-brand-btn" style="cursor:pointer;" title="Home">
        <span class="sidebar-brand-title"><span class="jx2-bracket">[</span><span class="jx2-lead">C</span>YBERDECK<span class="jx2-bracket">]</span></span>
      </div>
      <div class="jx2-hud-chip-row" id="sidebar-hud-chips" aria-live="polite">
        <span class="jx2-hud-chip" id="chip-vault"><span class="jx2-hud-chip-dot jx2-hud-chip-dot--unknown"></span><span class="jx2-hud-chip-label">VAULT</span></span>
        <span class="jx2-hud-chip" id="chip-index"><span class="jx2-hud-chip-dot jx2-hud-chip-dot--unknown"></span><span class="jx2-hud-chip-label">INDEX</span></span>
        <span class="jx2-hud-chip" id="chip-lock"><span class="jx2-hud-chip-dot jx2-hud-chip-dot--unknown"></span><span class="jx2-hud-chip-label">LOCK</span></span>
      </div>
    </div>
    <div class="sidebar-inner" id="sidebar-inner"><!-- nav sections injected by deck.js --></div>
    <div class="sidebar-user-bar" id="sidebar-user-bar">
      <div class="user-bar-left">
        <div class="user-bar-avatar" id="user-bar-avatar"></div>
        <div style="display:flex;flex-direction:column;gap:1px;">
          <span class="user-bar-name">Operator</span>
          <span class="sidebar-user-status">&#9679; OFFLINE-FIRST</span>
        </div>
      </div>
      <div class="user-bar-actions">
        <button type="button" class="user-bar-btn" id="btn-settings" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="chat-container welcome-active" id="deck-main" aria-label="Content area">
    <h1 class="a11y-visually-hidden">CyberDeck</h1>
    <div class="chat-top-bar">
      <div class="chat-meta-overlay"><span id="deck-title">CyberDeck</span></div>
      <button class="deck-search-pill" id="deck-search-pill" style="margin-left:auto;" title="Search (Ctrl/Cmd+K)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        Search <kbd>⌘K</kbd>
      </button>
    </div>
    <div id="deck-view"><!-- active module rendered here by deck.js --></div>
  </main>

  <script src="/static/deck/deck.js"></script>
  <script src="/static/deck/deck-ui.js"></script>
  <script src="/static/deck/deck-cmd.js"></script>
  <script src="/static/deck/knowledge.js"></script>
  <script src="/static/deck/courses.js"></script>
  <script src="/static/deck/credentials.js"></script>

  <script src="/static/deck/netlab.js"></script>
  <script src="/static/deck/home.js"></script>
  <script src="/static/deck/playbooks.js"></script>

  <script src="/static/deck/feeds.js"></script>
  <script src="/static/deck/topology.js"></script>
  <script src="/static/deck/board.js"></script>
  <script src="/static/deck/scan.js"></script>
  <script src="/static/deck/flashcards.js"></script>
  <script src="/static/deck/snippets.js"></script>
  <script src="/static/deck/resources.js"></script>
  <script src="/static/deck/toolkit.js"></script>
  <script src="/static/deck/progress.js"></script>

  <script src="/static/deck/terminal.js"></script>
  <script src="/static/deck/welcome.js"></script>
</body>
</html>
