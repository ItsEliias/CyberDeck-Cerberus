name: Build desktop app

# Windows-first, then macOS. Manual trigger (or on a version tag).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pythonnet
      - name: Build CyberDeck.exe
        run: pyinstaller --noconfirm cyberdeck.spec
      - uses: actions/upload-artifact@v4
        with:
          name: CyberDeck-windows
          path: dist/CyberDeck.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build CyberDeck.app
        run: pyinstaller --noconfirm cyberdeck.spec
      - name: Zip app
        run: cd dist && zip -r CyberDeck-macos.zip CyberDeck.app
      - uses: actions/upload-artifact@v4
        with:
          name: CyberDeck-macos
          path: dist/CyberDeck-macos.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # pywebview's Linux backend is WebKit2GTK — needs the GTK/WebKit system libs
      # + GObject introspection at build time (and on the user's machine at runtime).
      - name: Install system deps (GTK / WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pycairo PyGObject
      - name: Build CyberDeck (Linux)
        run: pyinstaller --noconfirm cyberdeck.spec
      - name: Package tarball
        run: cd dist && chmod +x CyberDeck && tar -czf CyberDeck-linux.tar.gz CyberDeck
      - uses: actions/upload-artifact@v4
        with:
          name: CyberDeck-linux
          path: dist/CyberDeck-linux.tar.gz

  # On a version tag (vX.Y.Z), publish a GitHub Release with the built binaries
  # attached. The repo is public, so these become plain download links (no login).
  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/CyberDeck-windows/CyberDeck.exe \
            artifacts/CyberDeck-macos/CyberDeck-macos.zip \
            artifacts/CyberDeck-linux/CyberDeck-linux.tar.gz \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
