name: Build desktop app

# Builds Windows / macOS / Linux desktop binaries. Manual trigger for CI verification,
# or on a version tag (vX.Y.Z) — on a tag each job uploads its binary straight to the
# GitHub Release. We deliberately DON'T use upload-artifact for the release hand-off:
# that consumes the Actions artifact-storage quota (which filled up and blocked uploads).
# Release storage is separate and unlimited on public repos.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # each job needs this to attach files to the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pythonnet
      - name: Build CyberDeck.exe
        run: pyinstaller --noconfirm cyberdeck.spec
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CyberDeck.exe
          generate_release_notes: true

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build CyberDeck.app
        run: pyinstaller --noconfirm cyberdeck.spec
      - name: Zip app
        run: cd dist && zip -r CyberDeck-macos.zip CyberDeck.app
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CyberDeck-macos.zip
          generate_release_notes: true

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # pywebview's Linux backend is WebKit2GTK — needs the GTK/WebKit system libs
      # + GObject introspection at build time (and on the user's machine at runtime).
      - name: Install system deps (GTK / WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # PyGObject 3.52+ switched to girepository-2.0; the 3.50 series still builds
          # against girepository-1.0 (libgirepository1.0-dev, installed above).
          pip install -r requirements.txt pyinstaller pycairo "PyGObject<3.52"
      - name: Build CyberDeck (Linux)
        run: pyinstaller --noconfirm cyberdeck.spec
      - name: Package tarball
        run: cd dist && chmod +x CyberDeck && tar -czf CyberDeck-linux.tar.gz CyberDeck
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CyberDeck-linux.tar.gz
          generate_release_notes: true
